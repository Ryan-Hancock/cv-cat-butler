[project]
name = "cat-butler"
version = "0.1.0"
description = "Rings a doorbell when a camera sees your cat waiting at the door."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "ultralytics>=8.3",
]

[project.scripts]
cat-butler = "cat_butler.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cat_butler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
